name: Photo workflow

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: ruby -c lib/photo_workflow/core.rb
      - run: ruby -c lib/photo_workflow/provider.rb
      - run: ruby -c lib/photo_workflow/server.rb
      - run: bin/test
      - run: bin/validate_boundary
      - run: test "$(bin/rails >/dev/null 2>&1; echo $?)" = 78
      - run: test "$(bin/rake >/dev/null 2>&1; echo $?)" = 78
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
